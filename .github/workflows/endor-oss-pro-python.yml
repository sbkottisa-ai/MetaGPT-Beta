name: Endor OSS Pro – Python SCA (BluePeak Demo)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  scan-pr:
    if: github.event_name == 'pull_request'
    name: Endor OSS Pro Scan (PR)
    permissions:
      security-events: write   # For SARIF if ever needed
      contents: read           # Checkout private repos
      actions: read            # For SARIF upload in private repos
      id-token: write          # Keyless auth to Endor
      pull-requests: write     # PR comments
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (editable install)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Endor OSS Pro Scan (PR)
        if: github.event_name == 'pull_request'
        uses: endorlabs/github-action@v1
        with:
          namespace: "sai-learn"
          # OSS Pro focus: dependency + pre-computed reachability
          scan_dependencies: true
          # No SAST / secrets here – those are Endor Code features
          pr: true
          enable_pr_comments: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
          scan_summary_output_type: "table"
          tags: "actor=${{ github.actor }},run-id=${{ github.run_id }}"

  scan-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Endor OSS Pro Scan (main branch)
    permissions:
      id-token: write
      repository-projects: read
      pull-requests: read
      contents: read
      security-events: write
      actions: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (editable install)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Endor OSS Pro Scan (push to main)
        if: github.event_name == 'push'
        uses: endorlabs/github-action@v1
        with:
          namespace: "sai-learn"
          scan_dependencies: true
          pr: false              # monitored/main-branch scan
          scan_summary_output_type: "table"
          sarif_file: "endor-findings.sarif"
          tags: "actor=${{ github.actor }},run-id=${{ github.run_id }}"

      - name: Upload findings to GitHub (SARIF)
        if: github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "endor-findings.sarif"
